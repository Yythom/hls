name: Build Windows installer

# 在真正的 Windows x64 runner 上打包，确保 ffmpeg / yt-dlp 等原生二进制
# 是 Windows 版（Mac 上交叉打包做不到这点）。
on:
  # 手动触发：Actions 页面点 "Run workflow"
  workflow_dispatch:
  # 打 tag（如 v1.0.0）时自动出包
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dist:win 前的 predist:win 会自动跑 fetch:bins 下载 ffmpeg / yt-dlp
      - name: Build Windows x64 installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownload-win-x64-setup
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error
