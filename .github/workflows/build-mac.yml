name: Build macOS installer

# 在 macOS runner 上打 dmg。dist:mac 目标同时产出 arm64 与 x64 两个 dmg，
# 原生二进制（ffmpeg / yt-dlp）由 predist:mac 里的 fetch:bins 自动下载。
on:
  # 手动触发：Actions 页面点 "Run workflow"
  workflow_dispatch:
  # 打 tag（如 v1.0.0）时自动出包
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dist:mac 前的 predist:mac 会自动跑 fetch:bins 下载 ffmpeg / yt-dlp
      - name: Build macOS dmg
        run: npm run dist:mac

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownload-mac-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
          if-no-files-found: error
